name: ceteris
description: Run a benchmark on the base and head of a pull request and refuse the comparison unless it is valid.
branding:
  icon: check-circle
  color: green

inputs:
  command:
    description: The benchmark command (a hyperfine, Google Benchmark, pytest-benchmark, JMH, cargo bench or plain command).
    required: true
  build:
    description: >-
      Shell commands that build the benchmark, run after checking out the base
      and again after checking out the head. Without this both sides run
      whatever binary was already in the tree, and the comparison measures
      nothing.
    default: ""
  repeats:
    description: Runs per side. Three or more enables the noise floor.
    default: "3"
  vary:
    description: Fields expected to differ between base and head, comma-separated. Source identity is always declared.
    default: ""
  require-signal:
    description: Fail unless some metric shows a gap above the noise floor.
    default: "false"
  metric:
    description: Extra NAME=REGEX metric patterns, newline-separated.
    default: ""
  python-version:
    description: Python used to run ceteris.
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install ceteris
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install -q "$ACTION_PATH"
    - name: Prepare isolated evidence directory
      id: prepare
      shell: bash
      run: |
        set -euo pipefail
        root="$(mktemp -d "$RUNNER_TEMP/ceteris.XXXXXXXX")"
        echo "root=$root" >> "$GITHUB_OUTPUT"
    - name: Benchmark base
      shell: bash
      env:
        CETERIS_STORE: ${{ steps.prepare.outputs.root }}/runs
        CETERIS_CONFIG: ${{ steps.prepare.outputs.root }}/config.json
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        METRIC: ${{ inputs.metric }}
        REPEATS: ${{ inputs.repeats }}
        COMMAND: ${{ inputs.command }}
        # Through the environment, not substituted into the script: an empty
        # build made `then ; fi`, a syntax error, and a build string is not
        # something to paste into a shell script unquoted.
        CETERIS_BUILD: ${{ inputs.build }}
      run: |
        set -euo pipefail
        git fetch -q origin "$BASE" || git cat-file -e "${BASE}^{commit}"
        git checkout -q --detach "$BASE"
        # Freeze before the build or candidate checkout can alter the policy.
        python -I - <<'PY'
        import json, os
        from pathlib import Path
        from ceteris.config import Config
        Path(os.environ["CETERIS_CONFIG"]).write_text(json.dumps(Config.load().freeze()))
        PY
        if [ -n "$CETERIS_BUILD" ]; then bash -ec "$CETERIS_BUILD"; fi
        python -I -m ceteris.action_run base
    - name: Benchmark head
      shell: bash
      env:
        CETERIS_STORE: ${{ steps.prepare.outputs.root }}/runs
        CETERIS_CONFIG: ${{ steps.prepare.outputs.root }}/config.json
        CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
        METRIC: ${{ inputs.metric }}
        REPEATS: ${{ inputs.repeats }}
        COMMAND: ${{ inputs.command }}
        CETERIS_BUILD: ${{ inputs.build }}
      run: |
        set -euo pipefail
        git fetch -q origin "$CANDIDATE" || git cat-file -e "${CANDIDATE}^{commit}"
        git checkout -q --detach "$CANDIDATE"
        if [ -n "$CETERIS_BUILD" ]; then bash -ec "$CETERIS_BUILD"; fi
        python -I -m ceteris.action_run head
    - name: Compare
      shell: bash
      env:
        CETERIS_STORE: ${{ steps.prepare.outputs.root }}/runs
        CETERIS_CONFIG: ${{ steps.prepare.outputs.root }}/config.json
        EXTRA_VARY: ${{ inputs.vary }}
        REQUIRE_SIGNAL: ${{ inputs.require-signal }}
        REPORT_PATH: ${{ steps.prepare.outputs.root }}/report.txt
      run: |
        set +e
        # Base and head are different builds by design; everything else gates.
        vary=(--vary source --vary deps
              --vary execution.program_sha256 --vary execution.program_scripts_sha256
              --vary execution.subject_sha256 --vary execution.subject_scripts_sha256)
        IFS=',' read -ra extra <<< "$EXTRA_VARY"
        for v in "${extra[@]}"; do [ -n "$v" ] && vary+=(--vary "$v"); done
        signal=""; [ "$REQUIRE_SIGNAL" = "true" ] && signal="--require-signal"
        ceteris compare --config "$CETERIS_CONFIG" --certify $signal "${vary[@]}" | tee "$REPORT_PATH"
        code=${PIPESTATUS[0]}
        { echo '## ceteris'; echo '```'; cat "$REPORT_PATH"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        exit $code
