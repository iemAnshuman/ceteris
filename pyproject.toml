[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ceteris"
version = "0.1.0"
description = "Capture benchmark run environment fingerprints and gate comparisons between them."
readme = "README.md"
requires-python = ">=3.9"
# No runtime dependencies. Everything used is standard library:
# argparse, dataclasses, enum, fnmatch, hashlib, json, os, platform,
# shutil, subprocess. The shipped defaults and packs are JSON, so nothing
# is needed to start the tool; tomllib (3.11+) is used only when a user
# writes their own config as TOML. Clusters commonly ship Python 3.9 as
# the system interpreter, and the tool must install there.
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anshuman Agrawal" }]
keywords = ["benchmark", "hpc", "reproducibility", "mpi", "slurm", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Benchmark",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/iemAnshuman/ceteris"
Issues = "https://github.com/iemAnshuman/ceteris/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-benchmark>=4"]

[project.scripts]
ceteris = "ceteris.cli:main"

[project.entry-points.pytest11]
ceteris = "ceteris.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ceteris = ["defaults.json", "packs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
