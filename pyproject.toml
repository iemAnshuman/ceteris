[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ceteris"
version = "0.1.0"
description = "Capture benchmark run environment fingerprints and gate comparisons between them."
readme = "README.md"
requires-python = ">=3.11"
# No runtime dependencies. Everything used is standard library:
# argparse, dataclasses, enum, fnmatch, hashlib, json, os, platform,
# shutil, subprocess, tomllib (3.11+). tomllib is the only reason for
# the 3.11 floor; JSON config files are also accepted so a cluster with
# an older interpreter is not locked out of configuring the tool.
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anshuman Agrawal" }]
keywords = ["benchmark", "hpc", "reproducibility", "mpi", "slurm", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Benchmark",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/iemAnshuman/ceteris"
Issues = "https://github.com/iemAnshuman/ceteris/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ceteris = "ceteris.cli:main"

[project.entry-points.pytest11]
ceteris = "ceteris.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ceteris = ["defaults.toml", "packs/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
