[activate]
tree_markers = ["pom.xml", "build.gradle", "build.gradle.kts", "settings.gradle"]

[capture]
env_allowlist = ["JAVA_TOOL_OPTIONS", "JAVA_OPTS", "JDK_JAVA_OPTIONS", "_JAVA_OPTIONS", "MAVEN_OPTS", "GRADLE_OPTS"]

[toolchain]
java = ["java", "-version"]

[lockfiles]
files = ["pom.xml", "gradle.lockfile", "gradle/wrapper/gradle-wrapper.properties"]
