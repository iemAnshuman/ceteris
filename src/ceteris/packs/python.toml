# Python. Activates on pyproject.toml / requirements / setup.py, or a python on PATH.
[activate]
tree_markers = ["pyproject.toml", "requirements.txt", "setup.py", "setup.cfg", "uv.lock", "poetry.lock", "Pipfile"]

[capture]
env_allowlist = ["PYTHONHASHSEED", "PYTHONOPTIMIZE", "PYTHONMALLOC", "PYTHONDONTWRITEBYTECODE", "MALLOC_ARENA_MAX", "OMP_NUM_THREADS", "MKL_NUM_THREADS", "OPENBLAS_NUM_THREADS", "NUMEXPR_NUM_THREADS"]

[toolchain]
python = ["python3", "--version"]

[lockfiles]
files = ["uv.lock", "poetry.lock", "Pipfile.lock", "requirements.txt", "requirements.lock", "environment.yml", "conda-lock.yml"]
